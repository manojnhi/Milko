name: Build Android APK

on:
  workflow_dispatch:        # GitHub > Actions > "Run workflow" se manually chalao
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      # Expo cloud pe APK banta hai; link expo.dev > Builds me milega
      - run: eas build --platform android --profile preview --non-interactive
