name: Build Android APK

on:
  workflow_dispatch:        # GitHub > Actions > "Run workflow" se manually chalao

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx expo install --fix
      - run: npm install -g eas-cli

      # Expo project link (pehli baar projectId app.json me likh deta hai)
      - run: eas init --non-interactive --force

      # APK Expo cloud pe banta hai; link expo.dev > Builds me milega
      - run: eas build --platform android --profile preview --non-interactive
